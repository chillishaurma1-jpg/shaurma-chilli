<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chilli — управление меню</title><link rel="stylesheet" href="style.css"><script defer src="lucide.js"></script><script defer src="app.js"></script></head>
<body>
<header><div class="brand"><img src="/preview/assets/logo-chilli.png" alt="Chilli"><div><h1>Управление меню</h1><span id="savedState">Загрузка…</span></div></div><nav><button id="save"><i data-lucide="save"></i>Сохранить</button><a href="/preview/" target="_blank" rel="noopener" id="preview"><i data-lucide="external-link"></i>Предпросмотр</a><button id="publish" class="primary"><i data-lucide="upload"></i>Опубликовать</button></nav></header>
<div id="notice" role="status" aria-live="polite"></div>
<div class="workspace">
<aside><div class="list-tools"><input id="search" type="search" placeholder="Поиск товаров" aria-label="Поиск товаров"><div class="filter-line"><select id="filter" aria-label="Фильтр по категории"><option value="">Все категории</option></select><button id="categories" class="icon" title="Категории" aria-label="Категории"><i data-lucide="folders"></i></button><button id="add" class="icon" title="Добавить товар" aria-label="Добавить товар"><i data-lucide="plus"></i></button></div><div id="count"></div></div><div id="products"></div></aside>
<main><div id="empty" hidden>Нет товаров</div><form id="editor" novalidate>
<div class="editor-heading"><h2 id="heading">Товар</h2><div class="actions"><button type="button" id="up" class="icon" title="Товар выше" aria-label="Товар выше"><i data-lucide="arrow-up"></i></button><button type="button" id="down" class="icon" title="Товар ниже" aria-label="Товар ниже"><i data-lucide="arrow-down"></i></button><button type="button" id="delete" class="icon danger" title="Удалить товар" aria-label="Удалить товар"><i data-lucide="trash-2"></i></button></div></div>
<div class="editor-grid"><div class="photo-area"><div class="photo-frame"><img id="photo" alt="Фотография товара" hidden><div id="noPhoto"><i data-lucide="image"></i></div></div><div class="photo-actions"><label class="button" for="upload"><i data-lucide="image-plus"></i>Выбрать фото</label><input id="upload" type="file" accept="image/png,image/jpeg,image/webp" hidden><button type="button" id="removePhoto" class="icon" title="Убрать фото" aria-label="Убрать фото"><i data-lucide="x"></i></button></div></div>
<div class="fields"><label>Название<input name="name" required maxlength="200"></label><label>Мелкая подпись<input name="subtitle" maxlength="200"></label><label>Категория<select name="category" required></select></label><div class="pair"><label>Самовывоз, ₽<input name="pickupPrice" type="number" min="0" max="1000000" step="0.01" required></label><label>Доставка, ₽<input name="deliveryPrice" type="number" min="0" max="1000000" step="0.01" placeholder="Нет в доставке"></label></div><label id="volumeField">Объем / вес порции<input name="volume" maxlength="200"></label><div class="checks"><label><input type="checkbox" name="visible">Показывать на сайте</label><label><input type="checkbox" name="popular">Популярное</label></div></div></div>
</form></main>
</div>
<footer><span>Chilli</span><span id="publication">Не опубликовано из этой панели</span></footer>
<dialog id="categoryDialog"><div class="editor-heading"><h2>Категории</h2><button id="closeCategories" class="icon" title="Закрыть" aria-label="Закрыть"><i data-lucide="x"></i></button></div><div id="categoryList"></div><form id="newCategory"><input id="categoryName" placeholder="Название категории" maxlength="80" required aria-label="Новая категория"><button class="icon" title="Добавить категорию" aria-label="Добавить категорию"><i data-lucide="plus"></i></button></form></dialog>
</body></html>
